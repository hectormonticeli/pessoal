<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div id="display"></div>

        <!-- Buttons -->
        <div id="box">
            <div class="button" id="bot1" onclick="buttonClicked(1)">1</div>
            <div class="button" id="bot2" onclick="buttonClicked(2)">2</div>
            <div class="button" id="bot3" onclick="buttonClicked(3)">3</div>
            <div class="button" id="plus" onclick="buttonClicked('+')">+</div>
            <div class="button" id="bot4" onclick="buttonClicked(4)">4</div>
            <div class="button" id="bot5" onclick="buttonClicked(5)">5</div>
            <div class="button" id="bot6" onclick="buttonClicked(6)">6</div>
            <div class="button" id="minus" onclick="buttonClicked('-')">-</div>
            <div class="button" id="bot7" onclick="buttonClicked(7)">7</div>
            <div class="button" id="bot8" onclick="buttonClicked(8)">8</div>
            <div class="button" id="bot9" onclick="buttonClicked(9)">9</div>
            <div class="button" id="times" onclick="buttonClicked('^')">^</div>
            <div class="button" id="bot0" onclick="buttonClicked('/')">/</div>
            <div class="button" id="divide" onclick="buttonClicked(0)">0</div>
            <div class="button" id="times" onclick="buttonClicked('*')">*</div>
            <div class="button" id="clean" onclick="clean()">C</div>
            <div class="button" id="openp" onclick="buttonClicked(`(`)">(</div>
            <div class="button" id="closep" onclick="buttonClicked(')')">)</div>
            <div class="button" id="dot" onclick="buttonClicked('.')">.</div>
            <div class="button" id="equal" onclick="equals()">=</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
